[project]
name = "campus-agent"
version = "0.1.0"
description = "CampusHub 智能助手：活动/社区 RAG + 二手商品工具调用"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
    "pymysql>=1.1,<1.2",
    "sqlalchemy[asyncio]>=2.1.6",
    # Agent 编排（框架只装依赖，编排逻辑自己写）
    "langgraph>=0.2",
    "aiomysql>=0.3.2",
    "openai>=3.42.1",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0.0",
    "langchain-openai>=1.7.3",
    "numpy>=2.5.4",
    "langchain>=1.4.8",
    "tavily-python>=0.8.5",
    "pyjwt>=2.15.1",
    "alibabacloud-oss-v2>=1.4.1",
    "python-multipart>=0.0.33",
    "aio-pika>=10.2.2",
    "pymilvus[milvus-lite]>=3.0.2",
    "milvus-lite>=3.2.2",
    # PDF 文本层直抽：纯 wheel（自带 pdfium），无系统依赖。
    # 有文本层的 PDF 用它 0.01 秒搞定，不必花 60 秒走 MinerU。
    "pypdfium2>=4.0",
    "mcp>=2.3.0",
    "akshare>=1.20.65",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "ruff>=0.11.0",
    "pre-commit>=4.0.0",
]

# ruff 同时做 lint 和 format——项目只有 20 个源文件，不值得分开装 black。
# 规则选保守子集：Codex 仓库自己也只开这些。
[tool.ruff]
target-version = "py312"
line-length = 100

# 国内源（与 PythonProject 一致）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
# ruff 的 isort 替代（项目没装独立 isort），按标准分组排序 import
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes（未使用的变量/import）
    "I",   # isort（import 排序）
    "B",   # flake8-bugbear（常见错误）
    "UP",  # pyupgrade（现代 Python 语法）
]
ignore = [
    # __init__.py 里经常有 "from .xxx import *" 用于 re-export
    "F401",   # 未使用的 import（__init__.py 可能 re-export）
    "E501",   # 行过长——format 自动处理，不手动卡
]
# 根目录 tests/ 和 scripts/ 与 src 同目录（不是 src layout），显式纳入
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]            # 测试里故意写一些"不严谨"的东西（mock 等）
"scripts/*" = ["B", "UP"]    # 一次性脚本不追求完美
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 pytest 能 import 到 app 包（tests/ 不是包，默认不会把项目根加进 sys.path）
pythonpath = ["."]
